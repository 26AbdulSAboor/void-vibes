<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidVibe🖤 - Official Website</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1a1a1a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    p {
      color: #aaa;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #ff0000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VoidVibe🖤</h1>
    <p>Welcome to the official home of VoidVibe! Watch anime edits, shorts, and more content directly on YouTube.</p>
    <a class="btn" href="https://www.youtube.com/@voidvibes-t8n" target="_blank">Visit YouTube Channel</a>
  </div>
</body>
</html>
